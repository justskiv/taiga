# Demo data for the kitchen sink — illustrative numbers, not a measurement.
# The file form of {{< chart >}}: two data sets under a toggle, a rule, a zone,
# "~" cells (no measurable difference) and a detail after each value.
# index.ru.md gets ks-speedup.ru.yaml, Hugo's language suffix.
x: {title: "object size, B", unit: " B", domain: [0, 136], ticks: [8, 16, 32, 48, 64, 80, 96, 128], narrow: [8, 32, 80, 128]}
"y": {title: "time saved per allocation", unit: "%", digits: 0, domain: [0, -50], ticks: [0, -10, -20, -30, -40, -50]}
series:
  - {name: laptop, color: blue, shape: circle}
  - {name: server, color: green, shape: square}
rules: [{x: 80, label: "80 B"}]
zones: [{from: 80, to: 136, label: "generic path"}]
legend: {same: "~ — no measurable difference"}
rest: 80
summary: "Up to 80 bytes both machines save time on every allocation; from 96 bytes on there is no difference."
modes:
  - label: no pointers
    rows:
      - [8, "-38 *5.7 → 3.5 ns*", "-30 *14.9 → 10.4 ns*"]
      - [16, "-37 *7.6 → 4.8 ns*", "-32 *26.8 → 18.2 ns*"]
      - [32, "-36 *9.4 → 6.0 ns*", "-31 *28.5 → 19.7 ns*"]
      - [48, "-27 *9.9 → 7.2 ns*", "-27 *30.4 → 22.2 ns*"]
      - [64, "-22 *10.8 → 8.4 ns*", "-27 *32.4 → 23.7 ns*"]
      - [80, "-20 *12.5 → 10.0 ns*", "-25 *33.5 → 25.1 ns*"]
      - [96, "~", "~"]
      - [128, "~", "~"]
  - label: with a pointer
    rows:
      - [8, -35, -33]
      - [16, -43, -35]
      - [32, -43, -34]
      - [48, -37, -30]
      - [64, -32, -30]
      - [80, -29, -26]
      - [96, "~", -6]
      - [128, null, "~"]
