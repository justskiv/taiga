# Theme module descriptor. `extended` is intentionally NOT declared: the flag
# is deprecated since v0.153, and a plain-CSS theme needs no extended build
# (esbuild for css.Build/js.Build ships in the ordinary binary).
[module]
  [module.hugoVersion]
    min = "0.146.0"

# Link previews (24-linkpreview.css / modules/linkpreview.js). A guide's hover
# preview is a build-time fragment served as a secondary output — the `preview`
# format: /<slug>/index.preview.html, a bare card (baseof.preview.html has no
# chrome). Distinct baseName so it never collides with the page's index.html;
# notAlternative keeps it out of rel=alternate <link>s and sitemaps.
[outputFormats]
  [outputFormats.preview]
    mediaType = "text/html"
    baseName = "index.preview"
    isHTML = true
    notAlternative = true
    permalinkable = false

# Guides (kind=page) and series landings (kind=section) get the preview output.
# A site that sets its OWN [outputs] must repeat "preview" there — Hugo overrides
# this map key by key, it does not append (see exampleSite/hugo.toml, docs/link-
# previews.md). home/taxonomy/term deliberately have no preview output.
[outputs]
  page = ["html", "preview"]
  section = ["html", "preview"]

# Defaults the theme falls back on when a site omits them; a site overrides
# these in its own hugo.toml (full registry: docs/params.md). Two kinds live
# here and nothing else: the placeholders a fresh install needs to render at all
# (the wordmark), and the theme's own look, which is the product and should not
# have to be switched on to be seen. Everything topic-specific stays in the site
# config.
[params]
  [params.brand]
    name = "taiga"   # wordmark in header/footer — override per site
    tld = ""         # optional suffix (e.g. ".dev"); empty = just the name

  # The home page as the theme means it to look: the brand at display size over
  # a backdrop that dissolves toward the feed, and rubric tiles without boxes so
  # that backdrop is visible between them. The three axes are independent and
  # each is switched OFF by setting its key to an empty string — a site that
  # wants the plain column back writes hero = "" and grid = "".
  [params.home]
    hero = "wordmark"      # display brand above the kicker · "" = no scene
    grid = "fade"          # backdrop: "grid" | "fade" | "dots" · "" = plain
    rubricCards = "naked"  # rubric tiles: "naked" | "boxed"

  # Coming-soon mode. OFF here so a normal install renders a normal site; the
  # key must exist, because baseof.html reads comingSoon.enable directly (same
  # idiom as brand.name above — the theme's defaults are the guard).
  [params.comingSoon]
    enable = false

  # Link previews. OFF by default so a fresh install ships nothing extra; a site
  # opts in with enable = true. budgetWords caps how much of an article a hover
  # preview shows, sliced by whole H2 sections. telegram.channels is the
  # whitelist of "own" channels whose t.me posts earn a pre-rendered card
  # (others get only the ✈ mark). See docs/link-previews.md.
  [params.linkPreviews]
    enable = false
    budgetWords = 1400
  [params.telegram]
    channels = []

  # Email subscription. OFF by default, and `enable` is the master switch: with
  # it false the theme renders no markup, ships no `nl-` rule in the CSS bundle,
  # no module in the JS bundle, no config script and no extra i18n keys. It is
  # off because turning it on is the small half of the job — the feature needs a
  # sending engine, an endpoint of your own to post to and a bot check in front
  # of it, none of which a theme can provide. A newsletter SHORTCODE written on
  # a site with the switch off fails the build rather than vanishing silently;
  # ignoreLogs = ['newsletter-disabled'] turns that back into silence for a site
  # that pulled the switch on purpose.
  #
  # The placement flags below only matter once it is on. The two CHROME
  # placements (a button in the header, a link in the footer) default to ON:
  # turning the feature on and finding no way to subscribe would be the
  # surprising outcome. The two CONTENT placements default to OFF: dropping a
  # form into every guide and every series landing is a decision about someone
  # else's writing, so it is opted into. See docs/newsletter.md.
  [params.newsletter]
    enable = false
    mode = "worker"                 # "worker" (proxy on your origin) | "direct"
    endpoint = "/api/subscribe"     # where the form posts, verbatim
    listUUID = ""                   # direct mode only: the listmonk list UUID
    turnstileSiteKey = ""           # empty = no bot challenge in the browser
    contactEmail = ""               # who a failing form offers to write to
    subscribePage = "/subscribe/"   # what the popover and the footer link to
    [params.newsletter.placements]
      header = true
      footer = true
      articleEnd = false
      seriesLanding = false
