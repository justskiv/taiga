# ── newsletter (28-newsletter.css / modules/newsletter.js) ────────────────────
# Подписка на рассылку: кнопка в шапке с поповером, блоки в статьях и на
# лендинге серии, ссылка в футере. Ключи nl_msg_* / nl_again живут в JS —
# js-bridge.html отдаёт их как window.THEME_I18N.nlMsg* (см. docs/i18n.md).
# Длинные тексты (страница подписки, тексты блоков в конкретных статьях) —
# контент сайта, здесь их нет намеренно.
[nl_btn_aria]
other = "Подписка на новые статьи"
[nl_btn_tip]
other = "Подписка"
[nl_pop_head]
other = "Подписка на новые статьи"
[nl_pop_more]
other = "Подробнее"
# Короткий намеренно: поле в поповере шапки — самое узкое место всей фичи, и
# правый край там отдан под кнопку, которую впрыскивают расширения-менеджеры
# паролей (см. .nl-field в 28-newsletter.css). "you@example.com" в остаток не
# помещался и обрезался на хвосте.
[nl_placeholder]
other = "your@mail.com"
[nl_field_aria]
other = "Адрес почты"
[nl_go]
other = "Подписаться"
[nl_note_short]
other = "Только новые статьи и большие апдейты. Отписка в один клик."
[nl_cta_title]
other = "Дальше — по почте"
[nl_cta_body]
other = "Новые гайды выходят нечасто. Оставьте адрес — пришлю письмо, когда будет что читать."
[nl_series_body]
other = "Серия активно дописывается. Оставьте почту — пришлю письмо, когда выйдет следующая часть."
[nl_block_aria]
other = "Подписка на рассылку"
[nl_dismiss_tip]
other = "Свернуть этот блок"
# От свёрнутого блока остаётся одна тихая строка, чтобы читатель мог
# развернуть форму обратно. nl_ghost_restore — ссылка в этой строке.
[nl_ghost]
other = "Форма подписки свёрнута"
[nl_ghost_restore]
other = "вернуть"
[nl_ghost_aria]
other = "Свёрнутая форма подписки"
[nl_restore_tip]
other = "Вернуть форму подписки"
# Показывается вместо формы, когда в этом браузере подписка уже завершилась.
# Флаг — булев, в localStorage; сам адрес не сохраняется никогда.
[nl_subscribed]
other = "Вы подписаны — пришлю письмо, когда выйдет новое."
[nl_subscribed_pop]
other = "Вы подписаны."
[nl_sub_other]
other = "подписать другой адрес"
[nl_foot_link]
other = "подписка"
[nl_archive_title]
other = "Архив выпусков"
[nl_archive_sub]
other = "Все письма открыты и читаются без подписки."
[nl_letter_inbox]
other = "Входящие"
# Образец письма повторяет боевой футер кампании, поэтому эти четыре строки
# читаются ровно как в отправляющем шаблоне. Меняются только вместе с ним.
# В nl_letter_reply {from} подставляется именем отправителя из шорткода.
#
# nl_letter_unsub — «отписаться», без «в один клик», и это НЕ рассинхрон с
# nl_note_short выше. В форме «отписка в один клик» — обещание ДО подписки,
# оно снимает страх «потом не выпутаюсь». В письме читатель уже подписан:
# ему нужна дверь, а не реклама её лёгкости. Не унифицировать.
[nl_letter_why]
other = "Вы получили это письмо, потому что подписались на рассылку {site}."
[nl_letter_unsub]
other = "отписаться"
[nl_letter_browser]
other = "открыть в браузере"
[nl_letter_reply]
other = "{from}. На письмо можно ответить — я прочитаю."
[nl_letter_to]
other = "кому: вам"
# JS-строки формы (modules/newsletter.js). В nl_msg_ok {email} подставляется
# адресом, который ввёл читатель, и выделяется жирным. Ключи *_hint — вторая,
# тихая строка под статусом; в nl_msg_fail_hint {email} — это адрес автора
# (params.newsletter.contactEmail), он становится ссылкой mailto, и без него
# строка не рендерится вовсе.
[nl_msg_empty]
other = "Введите адрес почты."
[nl_msg_typo]
other = "Похоже, в адресе опечатка — проверьте его."
[nl_msg_fail]
other = "Не получилось — попробуйте ещё раз."
# Не отмазка, а единственный выход из легитимного тупика: адрес, который список
# заблокировал после отбивки письма, будет получать ту же ошибку на каждой
# попытке, и «попробуйте ещё раз» ему уже не поможет.
[nl_msg_fail_hint]
other = "Повторяется? Напишите мне: {email}"
[nl_msg_ok]
other = "Письмо с подтверждением отправлено на {email}. Перейдите по ссылке из письма — и всё."
# Письмо уходит на каждую повторную попытку, так что подсказка честная: если его
# не видно, оно почти наверняка в спаме.
[nl_msg_ok_hint]
other = "Если письма нет — загляните в спам."
[nl_again]
other = "указать другой адрес"
