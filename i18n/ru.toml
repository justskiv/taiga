# runnable snippets: the editing controls next to codapi's Run button. The
# labels stay in English on purpose — Run comes from codapi itself and cannot be
# translated without forking it, and a half-translated row of controls reads
# worse than a consistent one. The hint sentence is prose, so it is translated.
# {mod} is filled in by the browser: ⌘ on a Mac, Ctrl everywhere else. The
# hint is injected as HTML and carries the theme's own key caps —
# <kbd class="kb">, the same ones the header's ⌘K wears.
[js_code_edit]
other = "Edit"
[js_code_close]
other = "Close"
[js_code_reset]
other = "Reset"
[js_code_hint]
other = "<kbd class=\"kb\">{mod} + Enter</kbd> запустить · <kbd class=\"kb\">Esc</kbd> закрыть"
[js_code_aria]
other = "Редактируемый код"

# кнопка копирования листинга. Она без подписи, поэтому js_copy_code — всё её
# доступное имя: название действия, а не его исхода. Остальные два и есть исход:
# смена иконки скринридеру ничего не говорит, поэтому результат объявляется через
# live-регион (modules/codecopy.js). Это проза — в отличие от Edit/Close/Reset
# выше её ничто не привязывает к английскому, и она переведена.
[js_copy_code]
other = "Скопировать код"
[js_copy_done]
other = "Код скопирован в буфер обмена"
[js_copy_fail]
other = "Не удалось скопировать код"

# run shortcode: the provenance line of the output block. run_example labels the
# output the AUTHOR recorded, run_ok / run_failed the one the READER just got
# (each followed by the duration), run_restore brings the author's back. These
# ARE prose — unlike the control labels above — so they are translated. The
# status line beside Run stays codapi's own English; a site that wants it
# translated passes status-running / status-done / status-failed to the
# shortcode.
